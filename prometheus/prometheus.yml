global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/alert.rules
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: redfish-exporter
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["redfish-exporter:9141"]
  - job_name: vsphere-exporter
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["vsphere-exporter:9142"]
